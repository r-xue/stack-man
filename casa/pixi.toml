# --------------------------------------------------------------------------
# Feature: Pipeline Baseline Dependencies
# --------------------------------------------------------------------------
[feature.pipeline.pypi-dependencies]
pipeline = { git = "https://open-bitbucket.nrao.edu/scm/pipe/pipeline.git" }

[environments]
default = { features = ["casa676-py312"], solve-group = "casa676-py312" }
casa674-py312 = { features = ["casa674-py312"] }
casa674-py312-pipeline = { features = ["casa674-py312", "pipeline"], solve-group = "casa674-py312" }
casa676-py312 = { features = ["casa676-py312"] }
casa677-py312 = { features = ["casa677-py312"] }
casa6dev-py312 = { features = ["casa6dev-py312"] }
# casa6local-py312 = { features = ["casa6local-py312"] }

[tasks]
# Data Management
# https://casadocs.readthedocs.io/en/latest/api/casaconfig.html#casaconfig.casaconfig
update-data = "python -m casaconfig --update-all && python -m casaconfig --summary && python -m casaconfig --current-data"

# Core Executables
[tasks.casa]
cmd = "sh -c 'export OMP_NUM_THREADS=\"${OMP_NUM_THREADS:-4}\" OPENBLAS_NUM_THREADS=\"${OPENBLAS_NUM_THREADS:-4}\"; cd \"${INIT_CWD:-.}\" && exec python -m casashell \"$@\"' _"

[tasks.casa.env]
OMP_PLACES = "threads"
OMP_PROC_BIND = "false"
PYTHONNOUSERSITE = "1"

# Pipeline Shortcut
[tasks.run-pipeline]
cmd = "sh -c 'export OMP_NUM_THREADS=\"${OMP_NUM_THREADS:-4}\" OPENBLAS_NUM_THREADS=\"${OPENBLAS_NUM_THREADS:-4}\"; cd \"${INIT_CWD:-.}\" && exec python -m casashell --nogui --nologger --log2term -c \"$@\"' _"

[tasks.run-pipeline.env]
OMP_PLACES = "threads"
OMP_PROC_BIND = "false"
PYTHONNOUSERSITE = "1"

[tasks.casampi]
description = "Launch CASA MPI (mimics mpicasa safety flags). Override ranks with CASA_NPROCS."
cmd = """\
sh -c 'cd "${INIT_CWD:-.}" && mpirun -wdir "${INIT_CWD:-.}" -display-allocation -display-map -oversubscribe \
--mca btl ^openib --mca btl_vader_single_copy_mechanism none --bind-to none \
-x FI_PROVIDER -x OMP_NUM_THREADS -x OPENBLAS_NUM_THREADS \
-x PATH -x PYTHONNOUSERSITE \
-n ${CASA_NPROCS:-4} \
python -m casashell "$@"' _\
"""

[tasks.casampi.env]
FI_PROVIDER = "^psm3"
PMIX_MCA_pcompress_base_silence_warning = "1"
OMP_PLACES = "threads"
OMP_PROC_BIND = "false"
OMP_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
PYTHONNOUSERSITE = "1"
